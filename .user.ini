; PHP 上传限制：分块上传的单块大小会被 upload_max_filesize / post_max_size 收敛，
; 沿用 PHP 默认值（常见 2M / 8M）会把大文件切成大量小分块串行上传，明显变慢。
; 本文件仅 PHP-FPM / FastCGI 会读取；Apache mod_php 与 PHP 内置服务器忽略它，
; 这类环境请在服务器 php.ini 中设置同样几项（见 README「部署」一节）。
; 改动后需等 user_ini.cache_ttl（默认 300 秒）到期或重启 PHP 才生效。
upload_max_filesize = 5120M
post_max_size = 5120M
max_execution_time = 1800
max_input_time = 1800
memory_limit = 256M